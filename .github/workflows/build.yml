name: build-packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential curl file \
            libgtk-3-dev libpango1.0-dev libsoup-3.0-dev libglib2.0-dev \
            libfontconfig1-dev libcairo2-dev \
            rpm patchelf python3 desktop-file-utils

      - name: Install HuxerUI SDK
        run: |
          curl -fsSL https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh -o /tmp/hux-install.sh
          sh /tmp/hux-install.sh --yes
          echo "HUXERUI_HOME=$HOME/.local/share/HuxerUI" >> "$GITHUB_ENV"
          echo "$HOME/.local/share/HuxerUI/bin" >> "$GITHUB_PATH"

      - name: Build
        run: huxerui build linux --config release

      - name: Stage and package
        run: |
          ./scripts/stage.sh
          ./scripts/package-all.sh "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: prts-cursor-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
